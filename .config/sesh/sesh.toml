[default_session]
preview_command = "eza -l --git --icons --no-permissions --color=always --no-filesize --no-user --no-time {}"

[[session]]
name = "config"
path = "$HOME/.config"
with_children = true

[[session]]
name = "go"
path = "$HOME/c/go"
with_children = true

[[session]]
name = "js"
path = "$HOME/c/js"
with_children = true
